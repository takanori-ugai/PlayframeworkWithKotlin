name: Gradle CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build and test
        run: ./gradlew --no-daemon clean build
      - name: Upload coverage to Codecov
        if: (success() || failure()) && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != ''
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          slug: takanori-ugai/PlayframeworkWithKotlin
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.6.2
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          include_passed: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: build/test-results/test/
          if-no-files-found: ignore
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-reports
          path: build/reports/jacoco/test/
          if-no-files-found: ignore
